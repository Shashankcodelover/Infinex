<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Infinex</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="navbar-brand">Infinex</div>
    <ul class="nav-links">
      <li><a href="#" id="logoutBtn">Logout</a></li>
    </ul>
  </nav>

  <!-- Particle Canvas -->
  <canvas id="particles"></canvas>

  <!-- Dashboard Container -->
  <div class="dashboard">
    <div class="header">
      <h1 class="title">Dashboard</h1>
      <p class="subtitle" id="userGreeting">Welcome back!</p>
      <div class="quick-nav">
        <button class="quick-nav-btn" onclick="navigateTo('create')">📝 Create Hackathon</button>
        <button class="quick-nav-btn" onclick="navigateTo('view')">📋 View Hackathons</button>
        <button class="quick-nav-btn" onclick="navigateTo('world')">🌍 Explore World</button>
      </div>
    </div>

    <!-- Form Section -->
    <div class="form-container">
      <div class="form-card">
        <h2>Create New Hackathon</h2>
        
        <form id="formInputs">
          <div class="form-group">
            <input type="text" id="name" placeholder="Hackathon Name" required>
          </div>
          <div class="form-group">
            <input type="text" id="description" placeholder="Description">
          </div>
          <div class="form-group">
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <input type="text" id="location" placeholder="Location">
          </div>
          <div class="form-group">
            <input type="file" id="logo">
          </div>
          <button type="button" onclick="addHackathon()" class="btn-primary">Insert Hackathon</button>
        </form>
      </div>
    </div>

    <!-- Fetch Section -->
    <div class="fetch-container">
      <button onclick="getHackathons()" class="btn-primary" style="font-size: 1rem; padding: 12px 30px;">📊 Fetch & Display Hackathons</button>
    </div>

    <!-- Hackathons Grid -->
    <div class="hackathons-grid" id="hackathons"></div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state" style="display: none; text-align: center; padding: 3rem; margin-top: 2rem; background: rgba(255,255,255,0.08); border: 1px solid rgba(0,255,255,0.2); border-radius: 15px;">
      <div style="font-size: 3rem; margin-bottom: 1rem;">📭</div>
      <h3 style="margin-bottom: 0.5rem;">No hackathons displayed</h3>
      <p style="color: rgba(255,255,255,0.7); margin-bottom: 1.5rem;">Click the "Fetch & Display Hackathons" button to view all hackathons</p>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:5000/api';

    // Navigation function
    function navigateTo(page) {
        if (page === 'create') {
            window.location.href = '../hackathon/create.html';
        } else if (page === 'view') {
            window.location.href = '../hackathon/view.html';
        } else if (page === 'world') {
            window.location.href = '../world/world.html';
        }
    }

    // Logout function
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = '../auth/login.html';
    });

    // User greeting
    function displayUserGreeting() {
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (user.username) {
            document.getElementById('userGreeting').textContent = `Welcome back, ${user.username}!`;
        }
    }

    // Particle animation
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];

    for (let i = 0; i < 60; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 1,
            dx: (Math.random() - 0.5) * 0.2,
            dy: (Math.random() - 0.5) * 0.2
        });
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(0,255,255,0.4)";
        particles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            p.x += p.dx;
            p.y += p.dy;

            if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        });
        requestAnimationFrame(animateParticles);
    }

    animateParticles();

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
  </script>

  <script>

    async function addHackathon() {
      try {
        const token = localStorage.getItem('token');
        if (!token) {
          alert('Please login first');
          return;
        }
        
        const name = document.getElementById("name").value.trim();
        const description = document.getElementById("description").value.trim();
        const date = document.getElementById("date").value;
        const location = document.getElementById("location").value.trim();
        
        if (!name || !date || !location) {
          alert('Please fill all required fields');
          return;
        }
        
        const formData = new FormData();
        formData.append("name", name);
        formData.append("description", description);
        formData.append("startDate", date);
        formData.append("endDate", date);
        formData.append("location", location);
        
        if (document.getElementById("logo").files[0]) {
          formData.append("logo", document.getElementById("logo").files[0]);
        }

        const response = await fetch("http://localhost:5000/api/hackathons", {
          method: "POST",
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });

        const data = await response.json();
        
        if (response.ok) {
          alert("✅ Hackathon created successfully!");
          document.getElementById("formInputs").reset();
          getHackathons();
        } else {
          alert(data.message || "❌ Failed to create hackathon");
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Error creating hackathon. Check console for details.');
      }
    }

    async function getHackathons() {
      try {
        const token = localStorage.getItem('token');
        const res = await fetch("http://localhost:5000/api/hackathons", {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        const data = await res.json();

        const container = document.getElementById("hackathons");
        const emptyState = document.getElementById("emptyState");
        
        if (!data || data.length === 0) {
          container.innerHTML = "";
          container.style.display = 'none';
          emptyState.style.display = 'block';
          return;
        }
        
        container.style.display = 'grid';
        emptyState.style.display = 'none';
        container.innerHTML = "";

        data.forEach(h => {
          const div = document.createElement("div");
          div.className = "hackathon-card";
          const status = new Date() < new Date(h.startDate || h.date) ? 'Upcoming' : new Date() > new Date(h.endDate || h.date) ? 'Completed' : 'Ongoing';
          const statusColor = status === 'Upcoming' ? '#00f5ff' : status === 'Ongoing' ? '#10b981' : '#ef4444';
          
          div.innerHTML = `
            <div class="card-header">
              ${h.logo ? `<img src="http://localhost:5000/${h.logo}" alt="${h.name}"/>` : '<div class="no-logo">📋</div>'}
            </div>
            <div class="card-body">
              <h3>${h.name}</h3>
              <p style="color: ${statusColor}; font-weight: 600;">Status: ${status}</p>
              <p class="description">${h.description || 'No description'}</p>
              <p class="date">📅 ${new Date(h.startDate || h.date).toDateString()}</p>
              <p class="location">📍 ${h.location}</p>
            </div>
          `;
          container.appendChild(div);
        });
      } catch (error) {
        console.error('Error fetching hackathons:', error);
        const container = document.getElementById("hackathons");
        container.innerHTML = '<p style="color: #ef4444; text-align: center; padding: 2rem;">❌ Error loading hackathons. Please try again.</p>';
      }
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
        displayUserGreeting();
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '../auth/login.html';
        }
    });

  </script>

</body>
</html>
