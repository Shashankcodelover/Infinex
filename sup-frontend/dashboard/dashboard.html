<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Infinex</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
</head>

<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="navbar-brand">Infinex</div>
    <ul class="nav-links">
      <li><a href="#" onclick="navigateTo('profile')">👤 Profile</a></li>
      <li><a href="#" id="logoutBtn">Logout</a></li>
    </ul>
  </nav>

  <!-- Message HUD -->
  <div class="message-hud">
    <div class="message-indicator">
      <span class="message-icon">⋯</span>
      <span class="message-count" id="dashMsgCount">0</span>
    </div>
    <div class="message-dropdown" id="dashMessageDropdown">
      <div class="message-header">
        <span class="message-title">🔔 Notifications</span>
        <button class="close-btn" id="dashCloseBtn">&times;</button>
      </div>
      <div class="message-list" id="dashMessageList">
        <p class="no-messages">No new notifications</p>
      </div>
    </div>
  </div>

  <!-- Particle Canvas -->
  <canvas id="particles"></canvas>

  <!-- Dashboard Container -->
  <div class="dashboard">
    <div class="header">
      <h1 class="title">Dashboard</h1>
      <p class="subtitle" id="userGreeting">Welcome back!</p>
      <div class="quick-nav">
        <button class="quick-nav-btn" onclick="navigateTo('daily-puzzle')">🧩 Daily Puzzle</button>
        <button class="quick-nav-btn" onclick="navigateTo('create')">📝 Create Hackathon</button>
        <button class="quick-nav-btn" onclick="navigateTo('view')">📋 View Hackathons</button>
        <button class="quick-nav-btn" onclick="navigateTo('team')">👥 Make Your Team</button>
        <button class="quick-nav-btn" onclick="navigateTo('world')">🌍 Explore World</button>
      </div>
    </div>
    notif-btn
    <!-- Hackathons Grid Section -->
    <div class="section-wrapper">
      <div class="section-header">
        <h2>Hackathons List</h2>
        <button onclick="getHackathons()" class="btn-secondary">🔄 Refresh</button>
      </div>

      <!-- Hackathons Grid -->
      <div class="hackathons-grid" id="hackathons"></div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state"
        style="display: none; text-align: center; padding: 3rem; margin-top: 2rem; background: rgba(255,255,255,0.08); border: 1px solid rgba(0,255,255,0.2); border-radius: 15px;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">📭</div>
        <h3 style="margin-bottom: 0.5rem;">No hackathons available</h3>
        <p style="color: rgba(255,255,255,0.7); margin-bottom: 1.5rem;">Create a new hackathon to get started</p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:5000/api';

    // Navigation function
    function navigateTo(page) {
      if (page === 'daily-puzzle') {
        window.location.href = '../daily-puzzle-brain-teaser/daily-puzzle-brain-teaser.html';
      } else if (page === 'create') {
        window.location.href = '../hackathon/create.html';
      } else if (page === 'view') {
        window.location.href = '../hackathon/view.html';
      } else if (page === 'world') {
        window.location.href = '../world/world.html';
      } else if (page === 'team') {
        window.location.href = '../team/team.html';
      } else if (page === 'profile') {
        window.location.href = '../profile/profile.html';
      }
    }

    // Logout function
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '../auth/login.html';
    });

    // Dashboard Message HUD functionality
    const dashIndicator = document.querySelector('.message-indicator');
    const dashDropdown = document.getElementById('dashMessageDropdown');
    const dashClose = document.getElementById('dashCloseBtn');
    const dashCount = document.getElementById('dashMsgCount');
    const dashList = document.getElementById('dashMessageList');

    dashIndicator.addEventListener('click', () => {
      dashDropdown.classList.toggle('active');
    });
    dashClose.addEventListener('click', () => dashDropdown.classList.remove('active'));
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.message-hud')) {
        dashDropdown.classList.remove('active');
      }
    });

    function updateDashboardMessages() {
      const messages = JSON.parse(localStorage.getItem('dashboardMessages') || '[]');
      const unread = messages.filter(m => !m.read).length;
      dashCount.textContent = unread;
      dashCount.style.display = unread > 0 ? 'flex' : 'none';
      if (messages.length === 0) {
        dashList.innerHTML = '<p class="no-messages">No new notifications</p>';
      } else {
        dashList.innerHTML = messages.map(msg => `
                <div class="message-item ${msg.read ? 'read' : 'unread'}">
                    <span class="msg-avatar">🔔</span>
                    <div class="msg-content">
                        <div class="msg-sender">${msg.sender || 'System'}</div>
                        <div class="msg-text">${msg.text}</div>
                    </div>
                </div>
            `).join('');
      }
    }
    updateDashboardMessages();
    setInterval(updateDashboardMessages, 5000);


    // User greeting
    function displayUserGreeting() {
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      if (user.name) {
        document.getElementById('userGreeting').textContent = `Welcome back, ${user.name}!`;
      }
    }

    // Particle animation
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];

    for (let i = 0; i < 60; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1,
        dx: (Math.random() - 0.5) * 0.2,
        dy: (Math.random() - 0.5) * 0.2
      });
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(0,255,255,0.4)";
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        p.x += p.dx;
        p.y += p.dy;

        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
      });
      requestAnimationFrame(animateParticles);
    }

    animateParticles();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    async function getHackathons() {
      try {
        const token = localStorage.getItem('token');
        const res = await fetch("http://localhost:5000/api/hackathons", {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        const data = await res.json();

        const container = document.getElementById("hackathons");
        const emptyState = document.getElementById("emptyState");

        if (!data || data.length === 0) {
          container.innerHTML = "";
          container.style.display = 'none';
          emptyState.style.display = 'block';
          return;
        }

        container.style.display = 'grid';
        emptyState.style.display = 'none';
        container.innerHTML = "";

        data.forEach(h => {
          const div = document.createElement("div");
          div.className = "hackathon-card";

          div.innerHTML = `
            <div class="card-header">
              ${h.logo ? `<img src="http://localhost:5000/${h.logo}" alt="${h.name}"/>` : '<div class="no-logo">📋</div>'}
            </div>
            <div class="card-body">
              <h3>${h.name}</h3>
              <p class="description">${h.description || 'No description'}</p>
              <p class="date">📅 ${new Date(h.date).toDateString()}</p>
              <p class="location">📍 ${h.location}</p>
              <p class="link"><a href="${h.hostingLink}" target="_blank">🔗 Register Here</a></p>
            </div>
          `;
          container.appendChild(div);
        });
      } catch (error) {
        console.error('Error fetching hackathons:', error);
        const container = document.getElementById("hackathons");
        container.innerHTML = '<p style="color: #ef4444; text-align: center; padding: 2rem;">❌ Error loading hackathons. Please try again.</p>';
      }
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      displayUserGreeting();
      const token = localStorage.getItem('token');
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      const userId = user._id || user.id;
      if (!token) {
        window.location.href = '../auth/login.html';
      }
      getHackathons();
    });


  </script>

</body>

</html>
