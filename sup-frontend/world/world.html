<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D World - Infinex</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="world.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-brand">Infinex 3D World</div>
        <ul class="nav-links">
            <li><a href="../dashboard/dashboard.html">Dashboard</a></li>
            <li><a href="#" id="logoutBtn">Logout</a></li>
        </ul>
    </nav>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Controls Help -->
    <div class="controls-panel">
        <div class="controls-title">🎮 Controls</div>
        <div class="controls-info">
            <p>🖱️ Drag to rotate</p>
            <p>🔍 Scroll to zoom</p>
            <p>✋ Right-click to pan</p>
        </div>
    </div>

    <!-- Message Indicator HUD -->
    <div class="message-hud">
        <div class="message-indicator">
            <span class="message-icon">💬</span>
            <span class="message-count" id="messageCount">0</span>
        </div>
        <div class="message-dropdown" id="messageDropdown">
            <div class="message-header">
                <span class="message-title">📨 Messages</span>
                <button class="close-btn" id="closeMsgBtn">&times;</button>
            </div>
            <div class="message-list" id="messageList">
                <p class="no-messages">No new messages</p>
            </div>
        </div>
    </div>
    <!-- Build Panel -->
    <div class="build-panel">
        <div class="controls-title">🏠 Build</div>
        <button id="roofBtn">Add Roof</button>
        <button id="floorBtn">Add 2nd Floor</button>
        <button id="resetBtn">Reset House</button>
    </div>

    <!-- Build Panel for house stages -->
    <div class="build-panel">
        <strong>Build House</strong>
        <button onclick="addRoof()">Add Roof</button>
        <button onclick="addSecondFloor()">Add Second Floor</button>
    </div>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="spinner"></div>
        <p>Loading 3D World...</p>
    </div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
      }
    }
    </script>

    <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    // Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 200, 1000);
    // expose for external scripts
    window.scene = scene;
    // expose THREE so world.js can create geometry
    window.THREE = THREE;

    // Camera Setup
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(10, 6, 15);

    // Renderer Setup
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(2, 3, 2);
    controls.minPolarAngle = 0.1;
    controls.maxPolarAngle = Math.PI / 2 - 0.02;
    controls.minDistance = 8;
    controls.maxDistance = 84; // Zoomed out a further ~5%
    controls.update();

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
    sunLight.position.set(20, 30, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 4096;
    sunLight.shadow.mapSize.height = 4096;
    sunLight.shadow.camera.far = 500;
    sunLight.shadow.camera.left = -100;
    sunLight.shadow.camera.right = 100;
    sunLight.shadow.camera.top = 100;
    sunLight.shadow.camera.bottom = -100;
    scene.add(sunLight);

    // Ground
    const groundMaterial = new THREE.MeshStandardMaterial({ 
        color: 0x228B22,
        roughness: 0.8,
        metalness: 0
    });
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(500, 500),
        groundMaterial
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Load Model
    const loader = new GLTFLoader();
    const loadingScreen = document.getElementById('loadingScreen');
    let modelLoaded = false;

    console.log('🚀 Starting to load 3D model from: ./models/level1.glb');
    console.log('Current page URL:', window.location.href);
    console.log('Model should be at:', new URL('./models/level1.glb', window.location.href).href);
    
    // Pre-check: Try to fetch the file to ensure it exists and get size info
    fetch('./models/level1.glb?v=' + Date.now())
        .then(response => {
            console.log('Fetch response status:', response.status);
            console.log('Fetch response size:', response.headers.get('content-length'), 'bytes');
            return response.arrayBuffer();
        })
        .then(arrayBuffer => {
            console.log('✅ File fetched successfully, size:', arrayBuffer.byteLength, 'bytes');
            // Check magic number
            const view = new Uint8Array(arrayBuffer);
            if (view[0] === 0x67 && view[1] === 0x6c && view[2] === 0x54 && view[3] === 0x46) {
                console.log('✅ GLB magic number verified');
            } else {
                throw new Error('Invalid GLB magic number');
            }
        })
        .catch(err => console.error('Fetch pre-check error:', err));
    
    loader.load(
        "./models/level1.glb?v=" + Date.now(),
        (gltf) => {
            console.log('✅ Model loaded successfully!');
            modelLoaded = true;
            const model = gltf.scene;

            // Auto-scale and center model
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            console.log('Model size:', size);

            // Scale the model appropriately
            const scaleFactor = 8 / Math.max(size.x, size.y, size.z);
            model.scale.setScalar(scaleFactor);

            // Recalculate box after scaling
            box.setFromObject(model);
            box.getCenter(center);
            
            // Position model: center X and Z, but keep bottom above ground on Y
            const minY = box.min.y;
            model.position.set(-center.x, -minY + 0.1, -center.z);

            // Set shadows
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (child.material) {
                        child.material.envMapIntensity = 1;
                    }
                }
            });

            scene.add(model);
            console.log('✅ Model added to scene');

            // Adjust camera based on model height
            const newBox = new THREE.Box3().setFromObject(model);
            const newSize = newBox.getSize(new THREE.Vector3());
            const height = newSize.y;
            camera.position.set(0, height * 0.6, height * 1.2);
            controls.target.set(0, height * 0.3, 0);
            controls.minDistance = height * 0.6;
            controls.maxDistance = height * 2.5;
            controls.update();

            // Hide loading screen
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                console.log('✅✅✅ 3D MODEL NOW VISIBLE! ✅✅✅');
            }, 300);
        },
        (progress) => {
            const percent = Math.round((progress.loaded / progress.total) * 100);
            console.log('📦 Loading: ' + percent + '%');
            loadingScreen.querySelector('p').textContent = `Loading 3D World... ${percent}%`;
        },
        (error) => {
            console.error('❌ GLTFLoader error:', error);
            // simply show failure message and leave ground empty
            loadingScreen.querySelector('p').textContent = '⚠️ Model unavailable';
            setTimeout(() => {
                loadingScreen.style.opacity = '0';
                setTimeout(() => loadingScreen.style.display = 'none', 300);
            }, 1500);
        }
    );

    // Handle window resize
    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation loop
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // expose objects for build controls
    window.scene = scene;
    window.camera = camera;
    window.renderer = renderer;
    window.controls = controls;

    // Logout functionality
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = '../auth/login.html';
    });

    // Message HUD Functionality
    const messageIndicator = document.querySelector('.message-indicator');
    const messageDropdown = document.getElementById('messageDropdown');
    const closeMsgBtn = document.getElementById('closeMsgBtn');
    const messageCount = document.getElementById('messageCount');
    const messageList = document.getElementById('messageList');

    // Toggle message dropdown on indicator click
    messageIndicator.addEventListener('click', () => {
        messageDropdown.classList.toggle('active');
    });

    // Close dropdown button
    closeMsgBtn.addEventListener('click', () => {
        messageDropdown.classList.remove('active');
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.message-hud')) {
            messageDropdown.classList.remove('active');
        }
    });

    // Function to update message count and list
    function updateMessages() {
        // Fetch messages from backend or local storage
        const messages = JSON.parse(localStorage.getItem('messages') || '[]');
        const unreadCount = messages.filter(m => !m.read).length;
        
        messageCount.textContent = unreadCount;
        messageCount.style.display = unreadCount > 0 ? 'flex' : 'none';

        if (messages.length === 0) {
            messageList.innerHTML = '<p class="no-messages">No new messages</p>';
        } else {
            messageList.innerHTML = messages.map((msg, idx) => `
                <div class="message-item ${msg.read ? 'read' : 'unread'}">
                    <span class="msg-avatar">👤</span>
                    <div class="msg-content">
                        <div class="msg-sender">${msg.sender || 'Team Member'}</div>
                        <div class="msg-text">${msg.text}</div>
                    </div>
                </div>
            `).join('');
        }
    }

    // Initialize messages
    updateMessages();

    // Listen for message updates (every 5 seconds)
    setInterval(updateMessages, 5000);
    </script>

    <script src="world.js"></script>
</body>
</html>
