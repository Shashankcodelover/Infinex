<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Infinex</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-brand">Infinex</div>
        <ul class="nav-links">
            <li><a href="../dashboard/dashboard.html">Dashboard</a></li>
            <li><a href="#" id="logoutBtn">Logout</a></li>
        </ul>
    </nav>

    <!-- Particle Canvas -->
    <canvas id="particles"></canvas>

    <!-- Main Content -->
    <div class="container">
        <div class="page-header">
            <h1>My Profile</h1>
            <p>Manage your professional coding profile</p>
        </div>

        <!-- Profile Content -->
        <div class="profile-wrapper">
            <!-- Profile Card (Left) -->
            <div class="profile-card">
                <div class="profile-picture-section">
                    <img id="profileImg" src="https://via.placeholder.com/150?text=Profile" alt="Profile Picture" class="profile-picture">
                    <input type="file" id="profilePictureInput" accept="image/*" style="display: none;">
                    <button onclick="document.getElementById('profilePictureInput').click()" class="upload-btn">Change Picture</button>
                </div>
                <div class="profile-info">
                    <h2 id="profileName">John Doe</h2>
                    <p id="profileState">California, USA</p>
                </div>
            </div>

            <!-- Edit Form (Right) -->
            <div class="form-wrapper">
                <form id="profileForm" class="form-card">
                    <h2>Edit Profile</h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" id="name" placeholder="Enter your full name" required>
                        </div>
                        <div class="form-group">
                            <label>State/City *</label>
                            <input type="text" id="state" placeholder="Your location" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Bio</label>
                        <textarea id="bio" placeholder="Tell us about yourself" rows="4"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Experience Level</label>
                            <select id="experience">
                                <option value="Beginner">Beginner</option>
                                <option value="Intermediate">Intermediate</option>
                                <option value="Advanced">Advanced</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>GitHub Profile</label>
                            <input type="url" id="github" placeholder="https://github.com/username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Portfolio Website</label>
                        <input type="url" id="portfolio" placeholder="https://yourportfolio.com">
                    </div>

                    <div class="form-group">
                        <label>Programming Languages (comma separated)</label>
                        <input type="text" id="languages" placeholder="Python, JavaScript, Java, C++">
                    </div>

                    <div class="form-group">
                        <label>Skills (comma separated)</label>
                        <input type="text" id="skills" placeholder="React, Node.js, Machine Learning, Web Design">
                    </div>

                    <div class="form-group">
                        <label>Domains of Interest (comma separated)</label>
                        <input type="text" id="domains" placeholder="AI/ML, Web Development, Mobile Apps, Blockchain">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Profile</button>
                        <a href="../dashboard/dashboard.html" class="btn btn-secondary">Cancel</a>
                    </div>

                    <div id="message" class="message"></div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Particle animation
        const canvas = document.getElementById("particles");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        for (let i = 0; i < 60; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1,
                dx: (Math.random() - 0.5) * 0.2,
                dy: (Math.random() - 0.5) * 0.2
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(0,255,255,0.4)";
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                p.x += p.dx;
                p.y += p.dy;

                if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
            });
            requestAnimationFrame(animateParticles);
        }

        animateParticles();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>

    <script src="profile.js"></script>
</body>
</html>
