<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Puzzle Brain Teaser - Infinex</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="daily-puzzle-brain-teaser.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-brand">Infinex</div>
        <ul class="nav-links">
            <li><a href="../dashboard/dashboard.html">Dashboard</a></li>
            <li><a href="#" id="logoutBtn">Logout</a></li>
        </ul>
    </nav>

    <!-- Particle Canvas -->
    <canvas id="particles"></canvas>

    <!-- Main Content -->
    <div class="container">
        <div class="page-header">
            <h1>Daily Puzzle Brain Teaser</h1>
            <p>Solve today's challenge and keep your streak alive!</p>
            <div class="streak-counter" id="streakCounter">
                <span class="fire-icon">🔥</span>
                <span class="streak-text" id="streakText">0 day streak</span>
            </div>
        </div>

        <!-- Puzzle Card -->
        <div id="puzzleContainer">
            <div class="loading">Loading today's puzzle...</div>
        </div>

        <!-- Stats Section -->
        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-value" id="statTotalSolved">0</div>
                <div class="stat-label">Total Solved</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statCurrentStreak">0</div>
                <div class="stat-label">Current Streak</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statBestStreak">0</div>
                <div class="stat-label">Best Streak</div>
            </div>
        </div>
    </div>

    <script>
        // Particle animation
        const canvas = document.getElementById("particles");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        for (let i = 0; i < 60; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1,
                dx: (Math.random() - 0.5) * 0.2,
                dy: (Math.random() - 0.5) * 0.2
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(0,255,255,0.4)";
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                p.x += p.dx;
                p.y += p.dy;

                if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
            });
            requestAnimationFrame(animateParticles);
        }

        animateParticles();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>

    <script src="daily-puzzle-brain-teaser.js"></script>
</body>
</html>
